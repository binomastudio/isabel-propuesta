<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>binoma · propuesta caducada · Isabel Solanich</title>
<style>
@font-face{font-family:'Bilmond';font-weight:800;font-style:normal;src:url('marca/fonts/Bilmond-ExtraBlack.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Bilmond';font-weight:700;font-style:normal;src:url('marca/fonts/Bilmond-Bold.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Serotiva';font-weight:400;font-style:normal;src:url('marca/fonts/Serotiva-Regular.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Serotiva';font-weight:500;font-style:normal;src:url('marca/fonts/Serotiva-Medium.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Serotiva';font-weight:600;font-style:normal;src:url('marca/fonts/Serotiva-SemiBold.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Interform Mono';font-weight:600;font-style:normal;src:url('marca/fonts/InterformMono-SemiBold.woff2') format('woff2');font-display:swap}
:root{
  --tinta:#0B0B0B;--papel:#FFFFFF;--hueso:#F4F4F1;--gris:#EDEDEA;--borde:#E4E4E0;
  --azul:#564CF8;--azul-h:#4433E6;
  --tx:#0B0B0B;--tx-mute:#5F5F5F;
  --ff-d:'Bilmond',system-ui,sans-serif;--ff:'Serotiva',system-ui,sans-serif;--ff-m:'Interform Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--hueso)}
body{font-family:var(--ff);color:var(--tx);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
.card{max-width:560px;width:100%;background:var(--papel);border:1px solid var(--borde);border-radius:20px;padding:clamp(32px,6vw,56px) clamp(26px,6vw,48px);text-align:center}
.logo{display:inline-block;margin-bottom:34px}
.logo img{height:26px;width:auto;display:block}
.kick{font-family:var(--ff-m);font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--tx-mute)}
h1{font-family:var(--ff-d);font-weight:800;letter-spacing:-.02em;line-height:1.08;font-size:clamp(26px,4.4vw,34px);margin:14px 0 16px;color:var(--tinta)}
p{font-size:16px;color:var(--tx-mute);max-width:42ch;margin:0 auto}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--ff-d);font-weight:700;font-size:14.5px;padding:13px 22px;border-radius:999px;text-decoration:none;white-space:nowrap}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn-azul{background:var(--azul);color:#fff}
.btn-azul:hover{background:var(--azul-h)}
.btn-ghost{background:transparent;color:var(--tinta);border:1.5px solid var(--borde)}
.btn-ghost:hover{border-color:var(--tinta)}
footer{margin-top:30px;font-family:var(--ff-m);font-size:11px;color:var(--tx-mute);letter-spacing:.02em}
footer b{color:var(--tinta)}
</style>
</head>
<body>
  <div class="card">
    <a class="logo" href="https://binoma.es" target="_blank" rel="noopener"><img src="marca/logo/lockup-azul.svg" alt="binoma"></a>
    <span class="kick">Propuesta · Isabel Solanich</span>
    <h1>Esta vista previa ha caducado</h1>
    <p>La propuesta que preparamos para tu web ya no está activa. Si quieres retomar el proyecto, escríbenos y lo repasamos juntos.</p>
    <div class="btns">
      <a class="btn btn-azul" href="https://wa.me/34633075106?text=Hola%20Pedro%2C%20soy%20Isabel%20Solanich%2C%20quiero%20retomar%20la%20propuesta%20de%20mi%20web." target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Escribir por WhatsApp
      </a>
      <a class="btn btn-ghost" href="mailto:info@binoma.es?subject=Retomar%20mi%20propuesta%20(Isabel%20Solanich)">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Escribir por email
      </a>
    </div>
    <footer><b>Pedro Augusto de Faria</b> · binoma, estudio de diseño web · Getafe, Madrid</footer>
  </div>
<script src="https://backoffice.binoma.es/assets/tracker.js?v=20261117" data-slug="isabel-propuesta" data-tipo="propuesta"></script>
</body>
</html>
